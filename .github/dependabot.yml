version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      ci-toolchain-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
    groups:
      deployment-base-images:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      browser-toolchain:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "@axe-core/playwright"
