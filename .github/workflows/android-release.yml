name: Verify and publish signed Android candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unpublished tag to recover
        required: true
      preflight_run:
        description: Successful exact-source preflight run
        required: true
  push:
    tags: ['android-v*', '!android-v*-recovery']

permissions:
  contents: read
  actions: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install controlled browser for the complete preflight
        run: npx playwright install --with-deps chromium
      - run: npm run check:ci
  release:
    if: github.event_name != 'workflow_dispatch'
    needs: preflight
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify publication permissions before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq 'select(.enabled == true) | .enabled' | grep -qx true
      - run: npm ci
      - run: npm run build -w @open-triage/contracts
      - run: node --test tests/android-*.test.mjs
      - run: npm run android:build
      - run: npm run build -w @open-triage/api
      - name: Restore protected release credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-production.p12"
      - name: Enable isolated emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-production.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_CERTIFICATE_SHA256: ${{ secrets.ANDROID_CERTIFICATE_SHA256 }}
          ANDROID_PREFLIGHT_PASSED: '1'
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          disable-animations: true
          script: node scripts/android-release-candidate.mjs
      - name: Preserve candidate evidence after publication failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-publication-recovery
          retention-days: 7
          path: |
            .local/android-releases/*/*.apk
            .local/android-releases/*/release.json
            .local/android-releases/*/SHA256SUMS
            .local/android-releases/*/upgrade-evidence.json
            .local/android-release-workflow/preflight-evidence.json
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-production.p12"

  recover:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android-release-recovery.yml
    with:
      tag: ${{ inputs.tag }}
      preflight_run: ${{ inputs.preflight_run }}
    secrets: inherit
