name: Verify and stage signed Android candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unpublished tag to recover
        required: true
      preflight_run:
        description: Successful exact-source preflight run
        required: true
  push:
    tags: ['android-v*', '!android-v*-recovery']

permissions:
  contents: read
  actions: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install controlled browser for the complete preflight
        run: npx playwright install --with-deps chromium
      - run: npm run check:ci
  release:
    if: github.event_name != 'workflow_dispatch'
    needs: preflight
    uses: ./.github/workflows/android-release-recovery.yml
    with:
      tag: ${{ github.ref_name }}
      preflight_run: ${{ format('{0}', github.run_id) }}
    secrets: inherit

  recover:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android-release-recovery.yml
    with:
      tag: ${{ inputs.tag }}
      preflight_run: ${{ inputs.preflight_run }}
    secrets: inherit
