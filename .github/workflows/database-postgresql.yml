name: Verify database foundation

on:
  push:
    branches: [main, feature/database-foundation]
  pull_request:
    branches: [main, feature/database-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-15:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: open_triage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_triage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_triage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:database
      - run: npm run test:integration -w @open-triage/database
      - run: npm run test:integration -w @open-triage/api
      - run: npm run scale:test:ci -w @open-triage/database
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-scale-test-ci
          path: packages/database/artifacts/scale-test-ci.json
