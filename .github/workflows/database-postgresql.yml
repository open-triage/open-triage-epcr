name: Verify database foundation

on:
  push:
    branches: [feature/database-foundation]
  pull_request:
    branches: [feature/database-foundation]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  postgresql-15:
    name: Validate / PostgreSQL 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: open_triage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_triage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_triage_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated database artifacts
        run: npm run check:database
      - name: Run database integration tests
        run: npm run test:integration -w @open-triage/database
      - name: Run API integration tests
        run: npm run test:integration -w @open-triage/api
      - name: Run CI scale checks
        run: npm run scale:test:ci -w @open-triage/database
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: database-scale-test-ci
          path: packages/database/artifacts/scale-test-ci.json
