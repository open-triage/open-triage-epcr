name: Demo validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/ci-cd-deployment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-validation:
    name: Validate / Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Lint all workspaces
        run: npm run lint
      - name: Run unit and workflow tests
        run: npm test
      - name: Build database artifacts, contracts, API, and web
        run: npm run build

  database-validation:
    name: Validate / PostgreSQL 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: open_triage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_triage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_triage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated database artifacts
        run: npm run check:database
      - name: Run database integration tests
        run: npm run test:integration -w @open-triage/database
      - name: Run API integration tests
        run: npm run test:integration -w @open-triage/api
      - name: Run CI scale checks
        run: npm run scale:test:ci -w @open-triage/database
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-scale-test-ci
          path: packages/database/artifacts/scale-test-ci.json

  web-deployment-validation:
    name: Validate / Web deployment
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /open-triage-epcr-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build deployable web application
        run: npm run build -w @open-triage/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the deployed web artifact
        run: npm run test:deployment -w @open-triage/web

  helm-validation:
    name: Validate / Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint chart
        run: >-
          helm lint deploy/helm/open-triage
          --set-string secrets.databaseUrl=postgresql://validation.invalid/open_triage
          --set-string secrets.patientKeyInstallationId=00000000-0000-0000-0000-000000000000
          --set-string secrets.patientKeySecretBase64=dmFsaWRhdGlvbi1vbmx5
      - name: Render Kubernetes manifests
        run: >-
          helm template open-triage deploy/helm/open-triage
          --set-string secrets.databaseUrl=postgresql://validation.invalid/open_triage
          --set-string secrets.patientKeyInstallationId=00000000-0000-0000-0000-000000000000
          --set-string secrets.patientKeySecretBase64=dmFsaWRhdGlvbi1vbmx5
          > /dev/null

  validation-gate:
    name: Required / Demo validation gate
    if: always()
    needs:
      - application-validation
      - database-validation
      - web-deployment-validation
      - helm-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every validation job to pass
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/require-demo-validation.mjs

  publish-images:
    name: Publish / ${{ matrix.component }} linux/amd64
    if: >-
      needs.validation-gate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validation-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: deploy/docker/api.Dockerfile
          - component: web
            dockerfile: deploy/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to the private GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-triage-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Record published image identity
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/open-triage-${{ matrix.component }}:${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >-
          node scripts/demo-image-identity.mjs record
          --component "$COMPONENT"
          --tag "$IMAGE_TAG"
          --digest "$IMAGE_DIGEST"
          --architecture linux/amd64
          --sha "$SOURCE_COMMIT"
          --owner "$REPOSITORY_OWNER"
          --output "image-identities/${COMPONENT}.json"
      - name: Upload image identity fragment
        uses: actions/upload-artifact@v4
        with:
          name: demo-image-identity-${{ matrix.component }}-${{ github.sha }}
          path: image-identities/${{ matrix.component }}.json
          if-no-files-found: error

  publish-image-manifest:
    name: Publish / Deployment image manifest
    if: >-
      needs.publish-images.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download published image identities
        uses: actions/download-artifact@v4
        with:
          pattern: demo-image-identity-*-${{ github.sha }}
          path: image-identities
          merge-multiple: true
      - name: Assemble exact deployment image manifest
        run: >-
          node scripts/demo-image-identity.mjs assemble
          --input image-identities
          --output demo-images.json
          --sha "${{ github.sha }}"
          --owner "${{ github.repository_owner }}"
      - name: Upload exact deployment image manifest
        uses: actions/upload-artifact@v4
        with:
          name: demo-deployment-images-${{ github.sha }}
          path: demo-images.json
          if-no-files-found: error
