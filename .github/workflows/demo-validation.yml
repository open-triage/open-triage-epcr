name: Demo validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deployment_revision:
        description: Full 40-character SHA of a commit reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'demo-deployment' || format('demo-validation-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  validate-deployment-revision:
    name: Validate / Deployment revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
          fetch-depth: 0
      - name: Require manual revisions to belong to main
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYMENT_REVISION: ${{ inputs.deployment_revision }}
        run: |
          [[ "$DEPLOYMENT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$DEPLOYMENT_REVISION" origin/main

  application-validation:
    name: Validate / Application
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Lint all workspaces
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Run workflow contract tests
        run: npm run test:workflow
      - name: Build database artifacts, contracts, API, and web
        run: npm run build

  database-validation:
    name: Validate / PostgreSQL 15
    needs: validate-deployment-revision
    uses: ./.github/workflows/database-postgresql.yml
    with:
      checkout_ref: ${{ inputs.deployment_revision || github.sha }}

  web-deployment-validation:
    name: Validate / Exact web container
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.demo.opentriage.org
      SOURCE_COMMIT: ${{ inputs.deployment_revision || github.sha }}
      WEB_CANDIDATE_IMAGE: open-triage-web:validation-${{ inputs.deployment_revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the deployable Nginx image
        run: >-
          docker build
          --file deploy/docker/web.Dockerfile
          --platform linux/amd64
          --tag "$WEB_CANDIDATE_IMAGE"
          --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
          --build-arg OPEN_TRIAGE_BUILD_SHA="$SOURCE_COMMIT"
          --label org.opencontainers.image.revision="$SOURCE_COMMIT"
          --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}"
          .
      - name: Reject a Docker context missing a client-build dependency
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          git archive HEAD | tar -x --directory "$fixture"
          rm "$fixture/packages/database/config/identifying-elements.json"
          if docker build \
            --file "$fixture/deploy/docker/web.Dockerfile" \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg OPEN_TRIAGE_BUILD_SHA="$SOURCE_COMMIT" \
            "$fixture"; then
            echo "Web image unexpectedly built without identifying-elements.json" >&2
            exit 1
          fi
      - name: Start the validated Nginx container
        run: docker run --detach --name open-triage-web-validation --publish 127.0.0.1:3109:80 "$WEB_CANDIDATE_IMAGE"
      - name: Require the Nginx container to become ready
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3109/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs open-triage-web-validation
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the root-hosted Nginx container
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3109
        run: npm run test:deployment -w @open-triage/web
      - name: Capture failed deployment browser server output
        if: failure()
        run: |
          mkdir -p apps/web/playwright-artifacts
          docker logs open-triage-web-validation > apps/web/playwright-artifacts/deployment-server.log 2>&1 || true
      - name: Upload deployment browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-results/deployment
            apps/web/playwright-artifacts/deployment-server.log
          if-no-files-found: warn
      - name: Stop the validation container
        if: always()
        run: docker rm --force open-triage-web-validation 2>/dev/null || true
      - name: Retain the exact validated web image
        run: docker save "$WEB_CANDIDATE_IMAGE" | gzip > "$RUNNER_TEMP/validated-web-image.tar.gz"
      - name: Upload the exact validated web image
        uses: actions/upload-artifact@v4
        with:
          name: validated-web-image-${{ inputs.deployment_revision || github.sha }}
          path: ${{ runner.temp }}/validated-web-image.tar.gz
          compression-level: 0
          if-no-files-found: error

  browser-critical-validation:
    name: Validate / Critical browser journey
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USE_LOCAL_DEMO_SESSION: "true"
      NEXT_PUBLIC_ROUTE_DEMO_MUTATIONS_TO_API: "true"
      OPEN_TRIAGE_BUILD_SHA: ${{ inputs.deployment_revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the production-style web artifact
        run: npm run build -w @open-triage/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the critical mobile browser journey
        run: npm run test:e2e:critical -w @open-triage/web
      - name: Upload critical browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-results/critical
            apps/web/playwright-artifacts/critical-server.log
          if-no-files-found: warn

  browser-e2e-validation:
    name: Validate / Complete browser suite
    if: github.event_name != 'pull_request'
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run every maintained non-deployment browser test
        run: npm run test:e2e -w @open-triage/web
      - name: Upload complete browser-suite failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-results/e2e
            apps/web/playwright-artifacts/e2e-server.log
          if-no-files-found: warn

  api-runtime-image-validation:
    name: Validate / Pruned API runtime image
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: open_triage_image_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_triage_image_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOURCE_COMMIT: ${{ inputs.deployment_revision || github.sha }}
      API_RUNTIME_IMAGE: open-triage-api:validation-${{ inputs.deployment_revision || github.sha }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_triage_image_test
      PATIENT_KEY_INSTALLATION_ID: 00000000-0000-4000-8000-000000000001
      PATIENT_KEY_VERSION: "1"
      PATIENT_KEY_SECRET_BASE64: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=
      AUTH_RATE_LIMIT_SECRET_BASE64: MjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjI=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - name: Build the API runtime image
        run: >-
          docker build
          --file deploy/docker/api.Dockerfile
          --platform linux/amd64
          --tag "$API_RUNTIME_IMAGE"
          --label org.opencontainers.image.revision="$SOURCE_COMMIT"
          --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}"
          .
      - name: Run migrations from the runtime image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL
          "$API_RUNTIME_IMAGE"
          npm run migrate:runtime -w @open-triage/database
      - name: Load the NEMSIS catalog from the runtime image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL
          "$API_RUNTIME_IMAGE"
          npm run load:catalog -w @open-triage/database
      - name: Create the ordinary fixture-test organization
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "insert into app_identity.organization (id, name, deployment_timezone)
          values ('32000000-0000-4000-8000-000000000001', 'Demonstration EMS', 'UTC')"
      - name: Run the fixture account bootstrap from the runtime image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL
          -e PATIENT_KEY_INSTALLATION_ID
          -e PATIENT_KEY_VERSION
          -e PATIENT_KEY_SECRET_BASE64
          "$API_RUNTIME_IMAGE"
          npm run bootstrap:synthetic:runtime -w @open-triage/database
      - name: Start the pruned API
        run: >-
          docker run --detach --name open-triage-api-runtime --network host
          -e DATABASE_URL
          -e PATIENT_KEY_INSTALLATION_ID
          -e PATIENT_KEY_VERSION
          -e PATIENT_KEY_SECRET_BASE64
          -e AUTH_RATE_LIMIT_SECRET_BASE64
          -e WEB_ORIGIN=http://localhost:3000
          "$API_RUNTIME_IMAGE"
      - name: Require the pruned API health check
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs open-triage-api-runtime
          exit 1
      - name: Validate every declared runtime command and generated asset
        run: >-
          docker run --rm "$API_RUNTIME_IMAGE"
          node deploy/docker/validate-api-runtime.mjs
      - name: Require the pruned production boundary
        run: |
          docker run --rm "$API_RUNTIME_IMAGE" sh -ec '
            for package in typescript @nestjs/cli next react concurrently tsx eslint; do
              test ! -e "/workspace/node_modules/$package"
            done
            test ! -e /workspace/apps/api/src
            test ! -e /workspace/packages/database/tests
            test ! -e /workspace/packages/database/scripts/reset-development-database.mjs
            test -f /workspace/runtime/api-runtime-manifest.json
          '
      - name: Stop the runtime API
        if: always()
        run: docker rm --force open-triage-api-runtime 2>/dev/null || true
      - name: Retain the exact validated API image
        run: docker save "$API_RUNTIME_IMAGE" | gzip > "$RUNNER_TEMP/validated-api-image.tar.gz"
      - name: Upload the exact validated API image
        uses: actions/upload-artifact@v4
        with:
          name: validated-api-image-${{ inputs.deployment_revision || github.sha }}
          path: ${{ runner.temp }}/validated-api-image.tar.gz
          compression-level: 0
          if-no-files-found: error

  helm-validation:
    name: Validate / Helm chart
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint chart
        run: >-
          helm lint deploy/helm/open-triage
          --values deploy/helm/open-triage/demo-reference.values.yaml
      - name: Render Kubernetes manifests
        run: >-
          helm template open-triage deploy/helm/open-triage
          --values deploy/helm/open-triage/demo-reference.values.yaml
          > "$RUNNER_TEMP/open-triage-rendered.yaml"
      - name: Validate Kubernetes 1.35 schemas
        run: >-
          docker run --rm --interactive
          ghcr.io/yannh/kubeconform:v0.8.0-alpine
          -strict -summary -kubernetes-version 1.35.0
          < "$RUNNER_TEMP/open-triage-rendered.yaml"
      - name: Run all Helm chart behavior tests
        run: npm run test:helm

  ephemeral-kubernetes-validation:
    name: Validate / Ephemeral Kubernetes
    needs:
      - api-runtime-image-validation
      - web-deployment-validation
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ inputs.deployment_revision || github.sha }}
      API_CANDIDATE_IMAGE: open-triage-api:validation-${{ inputs.deployment_revision || github.sha }}
      WEB_CANDIDATE_IMAGE: open-triage-web:validation-${{ inputs.deployment_revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Create a Kubernetes 1.35 kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.31.0
          kubectl_version: v1.35.0
          cluster_name: open-triage-validation
          wait: 120s
      - name: Download the exact validated API image
        uses: actions/download-artifact@v4
        with:
          name: validated-api-image-${{ inputs.deployment_revision || github.sha }}
          path: validated-api-image
      - name: Download the exact validated web image
        uses: actions/download-artifact@v4
        with:
          name: validated-web-image-${{ inputs.deployment_revision || github.sha }}
          path: validated-web-image
      - name: Load the validated candidate images into Kubernetes
        run: |
          gunzip --stdout validated-api-image/validated-api-image.tar.gz | docker load
          gunzip --stdout validated-web-image/validated-web-image.tar.gz | docker load
          kind load docker-image --name open-triage-validation \
            "$API_CANDIDATE_IMAGE" "$WEB_CANDIDATE_IMAGE"
      - name: Require API and web image provenance
        run: |
          for image in "$API_CANDIDATE_IMAGE" "$WEB_CANDIDATE_IMAGE"; do
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$SOURCE_COMMIT"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")" = "${{ github.server_url }}/${{ github.repository }}"
          done
      - name: Require server-side manifest validation
        run: |
          helm template open-triage deploy/helm/open-triage \
            --values deploy/helm/open-triage/demo-reference.values.yaml \
            | kubectl apply --dry-run=server --filename=-
      - name: Install and exercise the chart with validated images
        run: >-
          bash scripts/validate-ephemeral-kubernetes.sh
          "$API_CANDIDATE_IMAGE"
          "$WEB_CANDIDATE_IMAGE"
      - name: Capture redacted Kubernetes failure diagnostics
        if: failure()
        run: >-
          bash scripts/capture-kubernetes-diagnostics.sh
          "$RUNNER_TEMP/kubernetes-diagnostics"
      - name: Upload Kubernetes failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kubernetes-diagnostics
          if-no-files-found: error
          retention-days: 14

  validation-gate:
    name: Required / Demo validation gate
    if: always()
    needs:
      - application-validation
      - database-validation
      - web-deployment-validation
      - browser-critical-validation
      - api-runtime-image-validation
      - helm-validation
      - ephemeral-kubernetes-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - name: Require every validation job to pass
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/require-demo-validation.mjs

  deployment-authorization:
    name: Authorize / Deployment provenance
    if: >-
      needs.validation-gate.result == 'success' &&
      needs.browser-e2e-validation.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validation-gate, browser-e2e-validation]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - name: Require approved merge and matching validation provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REVISION: ${{ inputs.deployment_revision || github.sha }}
          VALIDATED_REVISION: ${{ inputs.deployment_revision || github.sha }}
          VALIDATION_RESULT: ${{ needs.validation-gate.result }}
          BROWSER_VALIDATION_RESULT: ${{ needs.browser-e2e-validation.result }}
          WORKFLOW_ID: demo-validation.yml
        run: node scripts/require-demo-provenance.mjs

  promote-api-image:
    name: Publish / Exact validated API image
    if: >-
      needs.deployment-authorization.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deployment-authorization
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_COMMIT: ${{ inputs.deployment_revision || github.sha }}
      API_CANDIDATE_IMAGE: open-triage-api:validation-${{ inputs.deployment_revision || github.sha }}
      API_RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/open-triage-api:${{ inputs.deployment_revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - name: Download the exact validated API image
        uses: actions/download-artifact@v4
        with:
          name: validated-api-image-${{ inputs.deployment_revision || github.sha }}
          path: validated-api-image
      - name: Authenticate to the private GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the validated image without rebuilding
        run: |
          gunzip --stdout validated-api-image/validated-api-image.tar.gz | docker load
          test "$(docker image inspect --format '{{.Architecture}}' "$API_CANDIDATE_IMAGE")" = amd64
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$API_CANDIDATE_IMAGE")" = "$SOURCE_COMMIT"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$API_CANDIDATE_IMAGE")" = "${{ github.server_url }}/${{ github.repository }}"
          docker tag "$API_CANDIDATE_IMAGE" "$API_RELEASE_IMAGE"
          docker push "$API_RELEASE_IMAGE" | tee "$RUNNER_TEMP/api-image-push.txt"
          image_digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' "$RUNNER_TEMP/api-image-push.txt" | tail -1)"
          test -n "$image_digest"
          node scripts/demo-image-identity.mjs record \
            --component api \
            --tag "$API_RELEASE_IMAGE" \
            --digest "$image_digest" \
            --architecture linux/amd64 \
            --sha "$SOURCE_COMMIT" \
            --owner "${{ github.repository_owner }}" \
            --output image-identities/api.json
      - name: Upload published image identity fragment
        uses: actions/upload-artifact@v4
        with:
          name: demo-image-identity-api-${{ inputs.deployment_revision || github.sha }}
          path: image-identities/api.json
          if-no-files-found: error

  promote-web-image:
    name: Publish / Exact validated web image
    if: >-
      needs.deployment-authorization.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deployment-authorization
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_COMMIT: ${{ inputs.deployment_revision || github.sha }}
      WEB_CANDIDATE_IMAGE: open-triage-web:validation-${{ inputs.deployment_revision || github.sha }}
      WEB_RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/open-triage-web:${{ inputs.deployment_revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - name: Download the exact validated web image
        uses: actions/download-artifact@v4
        with:
          name: validated-web-image-${{ inputs.deployment_revision || github.sha }}
          path: validated-web-image
      - name: Authenticate to the private GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the validated image without rebuilding
        run: |
          gunzip --stdout validated-web-image/validated-web-image.tar.gz | docker load
          test "$(docker image inspect --format '{{.Architecture}}' "$WEB_CANDIDATE_IMAGE")" = amd64
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$WEB_CANDIDATE_IMAGE")" = "$SOURCE_COMMIT"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$WEB_CANDIDATE_IMAGE")" = "${{ github.server_url }}/${{ github.repository }}"
          docker tag "$WEB_CANDIDATE_IMAGE" "$WEB_RELEASE_IMAGE"
          docker push "$WEB_RELEASE_IMAGE" | tee "$RUNNER_TEMP/web-image-push.txt"
          image_digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' "$RUNNER_TEMP/web-image-push.txt" | tail -1)"
          test -n "$image_digest"
          node scripts/demo-image-identity.mjs record \
            --component web \
            --tag "$WEB_RELEASE_IMAGE" \
            --digest "$image_digest" \
            --architecture linux/amd64 \
            --sha "$SOURCE_COMMIT" \
            --owner "${{ github.repository_owner }}" \
            --output image-identities/web.json
      - name: Upload published image identity fragment
        uses: actions/upload-artifact@v4
        with:
          name: demo-image-identity-web-${{ inputs.deployment_revision || github.sha }}
          path: image-identities/web.json
          if-no-files-found: error

  publish-image-manifest:
    name: Publish / Deployment image manifest
    if: >-
      needs.promote-api-image.result == 'success' &&
      needs.promote-web-image.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - promote-api-image
      - promote-web-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - name: Download published image identities
        uses: actions/download-artifact@v4
        with:
          pattern: demo-image-identity-*-${{ inputs.deployment_revision || github.sha }}
          path: image-identities
          merge-multiple: true
      - name: Assemble exact deployment image manifest
        run: >-
          node scripts/demo-image-identity.mjs assemble
          --input image-identities
          --output demo-images.json
          --sha "${{ inputs.deployment_revision || github.sha }}"
          --owner "${{ github.repository_owner }}"
      - name: Upload exact deployment image manifest
        uses: actions/upload-artifact@v4
        with:
          name: demo-deployment-images-${{ inputs.deployment_revision || github.sha }}
          path: demo-images.json
          if-no-files-found: error

  deploy-demo:
    name: Deploy / DOKS demo
    if: >-
      needs.publish-image-manifest.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish-image-manifest
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact deployment image manifest
        uses: actions/download-artifact@v4
        with:
          name: demo-deployment-images-${{ inputs.deployment_revision || github.sha }}
      - name: Verify and select tested images
        id: images
        run: >-
          node scripts/demo-deployment-values.mjs
          --manifest demo-images.json
          --owner "${{ github.repository_owner }}"
          --sha "${{ inputs.deployment_revision || github.sha }}"
          --output "$GITHUB_OUTPUT"
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Install doctl with scoped demo credentials
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Obtain an expiring DOKS kubeconfig
        env:
          DOKS_CLUSTER_NAME: ${{ vars.DOKS_CLUSTER_NAME }}
          KUBECONFIG: ${{ runner.temp }}/open-triage-kubeconfig
        run: doctl kubernetes cluster kubeconfig save "$DOKS_CLUSTER_NAME" --expiry-seconds 1800
      - name: Provision isolated demo workload credentials
        env:
          KUBECONFIG: ${{ runner.temp }}/open-triage-kubeconfig
        run: >-
          bash scripts/provision-demo-workload-secrets.sh
          "${{ steps.images.outputs.api-repository }}:${{ steps.images.outputs.api-tag }}"
      - name: Atomically deploy tested images
        env:
          KUBECONFIG: ${{ runner.temp }}/open-triage-kubeconfig
        run: |
          previous_migration_pod="$(kubectl get pods --namespace open-triage \
            --selector app.kubernetes.io/component=migration \
            --output jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          monitor_migration() {
            local previous_pod="$1"
            local pod=""
            for _ in {1..120}; do
              pod="$(kubectl get pods --namespace open-triage \
                --selector app.kubernetes.io/component=migration \
                --output jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
              [[ -n "$pod" && "$pod" != "$previous_pod" ]] && break
              sleep 2
            done
            [[ -n "$pod" && "$pod" != "$previous_pod" ]] || return 0
            echo "Monitoring migration pod $pod"
            kubectl get pod "$pod" --namespace open-triage --output wide --watch &
            local watch_pid=$!
            kubectl logs "$pod" --namespace open-triage --all-containers=true \
              --follow --pod-running-timeout=9m || true
            kill "$watch_pid" 2>/dev/null || true
            wait "$watch_pid" 2>/dev/null || true
          }

          monitor_migration "$previous_migration_pod" &
          monitor_pid=$!
          set +e
          helm upgrade --install open-triage deploy/helm/open-triage \
            --values deploy/helm/open-triage/demo-reference.values.yaml \
            --namespace open-triage \
            --create-namespace \
            --atomic \
            --cleanup-on-fail \
            --wait \
            --timeout 10m \
            --history-max 10 \
            --set-string api.image.repository="${{ steps.images.outputs.api-repository }}" \
            --set-string api.image.tag="${{ steps.images.outputs.api-tag }}" \
            --set-string web.image.repository="${{ steps.images.outputs.web-repository }}" \
            --set-string web.image.tag="${{ steps.images.outputs.web-tag }}"
          helm_status=$?
          set -e
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          exit "$helm_status"
      - name: Diagnose failed atomic deployment
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/open-triage-kubeconfig
        run: |
          kubectl get jobs,pods --namespace open-triage --output wide || true
          kubectl describe job open-triage-migration --namespace open-triage || true
          kubectl logs job/open-triage-migration --namespace open-triage --all-containers=true || true
          kubectl get events --namespace open-triage \
            --sort-by='.metadata.creationTimestamp' --output wide | tail -80 || true
      - name: Verify the public HTTPS deployment
        env:
          DEMO_WEB_URL: https://demo.opentriage.org
          DEMO_API_URL: https://api.demo.opentriage.org
        run: node scripts/demo-smoke-test.mjs
