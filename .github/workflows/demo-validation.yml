name: Demo validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/ci-cd-deployment]
  workflow_dispatch:
    inputs:
      deployment_revision:
        description: Full 40-character SHA of a commit reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'demo-deployment' || format('demo-validation-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  validate-deployment-revision:
    name: Validate / Deployment revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
          fetch-depth: 0
      - name: Require manual revisions to belong to main
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOYMENT_REVISION: ${{ inputs.deployment_revision }}
        run: |
          [[ "$DEPLOYMENT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$DEPLOYMENT_REVISION" origin/main

  application-validation:
    name: Validate / Application
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Lint all workspaces
        run: npm run lint
      - name: Run unit and workflow tests
        run: npm test
      - name: Build database artifacts, contracts, API, and web
        run: npm run build

  database-validation:
    name: Validate / PostgreSQL 15
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: open_triage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_triage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_triage_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated database artifacts
        run: npm run check:database
      - name: Run database integration tests
        run: npm run test:integration -w @open-triage/database
      - name: Run API integration tests
        run: npm run test:integration -w @open-triage/api
      - name: Run CI scale checks
        run: npm run scale:test:ci -w @open-triage/database
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-scale-test-ci
          path: packages/database/artifacts/scale-test-ci.json

  web-deployment-validation:
    name: Validate / Web deployment
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build deployable web application
        env:
          NEXT_PUBLIC_API_URL: https://api.demo.opentriage.org
          NEXT_PUBLIC_INSTALLATION_SETTINGS_BASELINE: synthetic-demo
        run: npm run build -w @open-triage/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the root-hosted web artifact
        run: npm run test:deployment -w @open-triage/web

  helm-validation:
    name: Validate / Helm chart
    needs: validate-deployment-revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint chart
        run: >-
          helm lint deploy/helm/open-triage
          --values deploy/helm/open-triage/demo-reference.values.yaml
          --set-string secrets.databaseUrl=postgresql://validation.invalid/open_triage
          --set-string secrets.patientKeyInstallationId=00000000-0000-0000-0000-000000000000
          --set-string secrets.patientKeySecretBase64=dmFsaWRhdGlvbi1vbmx5
      - name: Render Kubernetes manifests
        run: >-
          helm template open-triage deploy/helm/open-triage
          --values deploy/helm/open-triage/demo-reference.values.yaml
          --set-string secrets.databaseUrl=postgresql://validation.invalid/open_triage
          --set-string secrets.patientKeyInstallationId=00000000-0000-0000-0000-000000000000
          --set-string secrets.patientKeySecretBase64=dmFsaWRhdGlvbi1vbmx5
          > /dev/null

  validation-gate:
    name: Required / Demo validation gate
    if: always()
    needs:
      - application-validation
      - database-validation
      - web-deployment-validation
      - helm-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - name: Require every validation job to pass
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/require-demo-validation.mjs

  publish-images:
    name: Publish / ${{ matrix.component }} linux/amd64
    if: >-
      needs.validation-gate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validation-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: deploy/docker/api.Dockerfile
            build_args: ""
          - component: web
            dockerfile: deploy/docker/web.Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.demo.opentriage.org
              NEXT_PUBLIC_INSTALLATION_SETTINGS_BASELINE=synthetic-demo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to the private GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/open-triage-${{ matrix.component }}:${{ inputs.deployment_revision || github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.deployment_revision || github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Record published image identity
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/open-triage-${{ matrix.component }}:${{ inputs.deployment_revision || github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ inputs.deployment_revision || github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >-
          node scripts/demo-image-identity.mjs record
          --component "$COMPONENT"
          --tag "$IMAGE_TAG"
          --digest "$IMAGE_DIGEST"
          --architecture linux/amd64
          --sha "$SOURCE_COMMIT"
          --owner "$REPOSITORY_OWNER"
          --output "image-identities/${COMPONENT}.json"
      - name: Upload image identity fragment
        uses: actions/upload-artifact@v4
        with:
          name: demo-image-identity-${{ matrix.component }}-${{ inputs.deployment_revision || github.sha }}
          path: image-identities/${{ matrix.component }}.json
          if-no-files-found: error

  publish-image-manifest:
    name: Publish / Deployment image manifest
    if: >-
      needs.publish-images.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - name: Download published image identities
        uses: actions/download-artifact@v4
        with:
          pattern: demo-image-identity-*-${{ inputs.deployment_revision || github.sha }}
          path: image-identities
          merge-multiple: true
      - name: Assemble exact deployment image manifest
        run: >-
          node scripts/demo-image-identity.mjs assemble
          --input image-identities
          --output demo-images.json
          --sha "${{ inputs.deployment_revision || github.sha }}"
          --owner "${{ github.repository_owner }}"
      - name: Upload exact deployment image manifest
        uses: actions/upload-artifact@v4
        with:
          name: demo-deployment-images-${{ inputs.deployment_revision || github.sha }}
          path: demo-images.json
          if-no-files-found: error

  deploy-demo:
    name: Deploy / DOKS demo
    if: >-
      needs.publish-image-manifest.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish-image-manifest
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deployment_revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact deployment image manifest
        uses: actions/download-artifact@v4
        with:
          name: demo-deployment-images-${{ inputs.deployment_revision || github.sha }}
      - name: Verify and select tested images
        id: images
        run: >-
          node scripts/demo-deployment-values.mjs
          --manifest demo-images.json
          --owner "${{ github.repository_owner }}"
          --sha "${{ inputs.deployment_revision || github.sha }}"
          --output "$GITHUB_OUTPUT"
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Install doctl with scoped demo credentials
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Obtain an expiring DOKS kubeconfig
        env:
          DOKS_CLUSTER_NAME: ${{ vars.DOKS_CLUSTER_NAME }}
          KUBECONFIG: ${{ runner.temp }}/open-triage-kubeconfig
        run: doctl kubernetes cluster kubeconfig save "$DOKS_CLUSTER_NAME" --expiry-seconds 600
      - name: Atomically deploy tested images
        env:
          KUBECONFIG: ${{ runner.temp }}/open-triage-kubeconfig
        run: >-
          helm upgrade --install open-triage deploy/helm/open-triage
          --values deploy/helm/open-triage/demo-reference.values.yaml
          --namespace open-triage
          --create-namespace
          --atomic
          --cleanup-on-fail
          --wait
          --timeout 10m
          --history-max 10
          --set-string api.image.repository="${{ steps.images.outputs.api-repository }}"
          --set-string api.image.tag="${{ steps.images.outputs.api-tag }}"
          --set-string web.image.repository="${{ steps.images.outputs.web-repository }}"
          --set-string web.image.tag="${{ steps.images.outputs.web-tag }}"
      - name: Verify the public HTTPS deployment
        env:
          DEMO_WEB_URL: https://demo.opentriage.org
          DEMO_API_URL: https://api.demo.opentriage.org
        run: node scripts/demo-smoke-test.mjs
