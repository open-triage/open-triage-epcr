server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # TLS terminates at the ingress; directory redirects must retain its public origin.
  absolute_redirect off;

  add_header Content-Security-Policy "__CONTENT_SECURITY_POLICY__" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Serve the public one-pager independently of the demo app and its service worker.
server {
  listen 8080;
  server_name opentriage.org;
  root /usr/share/nginx/html/landing;
  absolute_redirect off;

  add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;

  location / {
    try_files $uri $uri/ =404;
  }
}
