# Non-secret values for the fixed public DOKS demo deployment.
nodeSelector:
  doks.digitalocean.com/node-pool: pool-6inz100pf

imagePullSecrets:
  - name: ghcr-pull

publicSite:
  enabled: true

ingress:
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: open-triage-tls
      hosts:
        - demo.opentriage.org
        - api.demo.opentriage.org
    - secretName: open-triage-public-site-tls
      hosts:
        - opentriage.org

secrets:
  api:
    existingSecret: open-triage-api-database
  migration:
    existingSecret: open-triage-migration-database
  analyticsProjector:
    existingSecret: open-triage-analytics-projector-database
  analyticsHealth:
    existingSecret: open-triage-analytics-health-database
  retention:
    existingSecret: open-triage-retention-database
  operationalAudit:
    existingSecret: open-triage-operational-audit-database

migration:
  bootstrapSynthetic: true
  # Retain lightweight hook requests; the container may still burst to the
  # chart's 500m CPU limit.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  # Surface database lock contention promptly instead of letting the atomic
  # deployment expire without the statement that is waiting.
  pgOptions: "-c lock_timeout=45s -c statement_timeout=8min"

analytics:
  # Retain lightweight requests when the projector overlaps maintenance jobs.
  resources:
    requests:
      cpu: 25m
