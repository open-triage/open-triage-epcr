{{- if .Values.analytics.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "open-triage.fullname" . }}-analytics-projector
  labels: {{- include "open-triage.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.analytics.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 12
  jobTemplate:
    spec:
      activeDeadlineSeconds: 110
      backoffLimit: 1
      template:
        spec:
          {{- with .Values.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          automountServiceAccountToken: false
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          restartPolicy: Never
          containers:
            - name: projector
              image: {{ include "open-triage.image" .Values.api.image | quote }}
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              securityContext: {{- toYaml .Values.api.securityContext | nindent 16 }}
              command: ["npm", "run", "project", "-w", "@open-triage/database"]
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "analytics-projector" "config" .Values.secrets.analyticsProjector) }}, key: DATABASE_URL } }
                - name: ANALYTICS_PROJECTOR_BATCH_SIZE
                  value: {{ .Values.analytics.batchSize | quote }}
                - name: ANALYTICS_PROJECTOR_MAX_ATTEMPTS
                  value: {{ .Values.analytics.maxAttempts | quote }}
              resources: {{- toYaml .Values.analytics.resources | nindent 16 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "open-triage.fullname" . }}-analytics-health
  labels: {{- include "open-triage.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.analytics.healthSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 12
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      backoffLimit: 0
      template:
        spec:
          {{- with .Values.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          automountServiceAccountToken: false
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          restartPolicy: Never
          containers:
            - name: health
              image: {{ include "open-triage.image" .Values.api.image | quote }}
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              securityContext: {{- toYaml .Values.api.securityContext | nindent 16 }}
              command: ["npm", "run", "project:health", "-w", "@open-triage/database"]
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "analytics-health" "config" .Values.secrets.analyticsHealth) }}, key: DATABASE_URL } }
                - name: ANALYTICS_PROJECTOR_FRESHNESS_TARGET_SECONDS
                  value: {{ .Values.analytics.freshnessTargetSeconds | quote }}
              resources: {{- toYaml .Values.analytics.healthResources | nindent 16 }}
{{- end }}
