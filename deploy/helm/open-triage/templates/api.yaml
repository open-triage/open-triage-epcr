apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-triage.fullname" . }}-api
  labels: {{- include "open-triage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: {{ .Values.api.strategy }}
  selector:
    matchLabels: { app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }} }
      containers:
        - name: api
          image: {{ include "open-triage.image" .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext: {{- toYaml .Values.api.securityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 3001 }]
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: DATABASE_URL } }
            - name: SUPABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: SUPABASE_URL, optional: true } }
            - name: SUPABASE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: SUPABASE_SECRET_KEY, optional: true } }
            - name: PATIENT_KEY_INSTALLATION_ID
              valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: PATIENT_KEY_INSTALLATION_ID } }
            - name: PATIENT_KEY_VERSION
              valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: PATIENT_KEY_VERSION } }
            - name: PATIENT_KEY_SECRET_BASE64
              valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: PATIENT_KEY_SECRET_BASE64 } }
            - name: AUTH_RATE_LIMIT_SECRET_BASE64
              valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: AUTH_RATE_LIMIT_SECRET_BASE64 } }
            - name: OFFLINE_RECOVERY_KEY_VERSION
              valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: OFFLINE_RECOVERY_KEY_VERSION } }
            - name: OFFLINE_RECOVERY_SECRET_BASE64
              valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: OFFLINE_RECOVERY_SECRET_BASE64 } }
            - name: PORT
              value: "3001"
            - name: AUTH_TRUST_PROXY_HOPS
              value: {{ .Values.api.trustProxyHops | quote }}
            - name: WEB_ORIGIN
              value: "https://{{ .Values.web.host }}"
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /api/health, port: http }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-triage.fullname" . }}-api
  labels: {{- include "open-triage.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
