{{- if and .Values.ingress.authenticationRateLimit.enabled (ne .Values.ingress.controller "nginx") }}
{{- fail "ingress.authenticationRateLimit requires ingress.controller=nginx; disable this nginx-only setting for Contour and configure rate limiting at your edge" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-triage.fullname" . }}
  labels: {{- include "open-triage.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.ingress.controller "nginx" }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    {{- else if eq .Values.ingress.controller "contour" }}
    ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- else }}
    {{- fail "ingress.controller must be nginx or contour" }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.web.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "open-triage.fullname" $ }}-web, port: { name: http } } }
    - host: {{ .Values.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "open-triage.fullname" $ }}-api, port: { name: http } } }
{{- if .Values.ingress.authenticationRateLimit.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-triage.fullname" . }}-authentication
  labels: {{- include "open-triage.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.authenticationRateLimit.requestsPerSecond | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.authenticationRateLimit.burstMultiplier | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.api.host }}
      http:
        paths:
          - path: /api/sessions
            pathType: Prefix
            backend: { service: { name: {{ include "open-triage.fullname" $ }}-api, port: { name: http } } }
{{- end }}
