apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-triage.fullname" . }}
  labels: {{- include "open-triage.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.web.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "open-triage.fullname" $ }}-web, port: { name: http } } }
    - host: {{ .Values.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "open-triage.fullname" $ }}-api, port: { name: http } } }
