{{- if .Values.migration.enabled }}
{{- $secretName := required "secrets.migration.existingSecret is required when migration.enabled is true; create the cluster-owned Secret before deploying" .Values.secrets.migration.existingSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "open-triage.fullname" . }}-migration
  labels: {{- include "open-triage.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # A completed Job is retained. The next release replaces only the Job;
    # committed database migrations remain recorded and are safely skipped.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  backoffLimit: 0
  template:
    metadata:
      labels: { app.kubernetes.io/component: migration, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: migration
          image: {{ include "open-triage.image" .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext: {{- toYaml .Values.api.securityContext | nindent 12 }}
          {{- if .Values.migration.bootstrapSynthetic }}
          command: ["npm", "run", "install:synthetic:runtime", "-w", "@open-triage/database"]
          {{- else }}
          command: ["npm", "run", "migrate:runtime", "-w", "@open-triage/database"]
          {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: DATABASE_URL } }
            {{- if .Values.migration.pgOptions }}
            - name: PGOPTIONS
              value: {{ .Values.migration.pgOptions | quote }}
            {{- end }}
          resources: {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
