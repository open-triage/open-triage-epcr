{{- if .Values.reviewWorker.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "open-triage.fullname" . }}-review-worker
  labels: {{- include "open-triage.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.reviewWorker.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 12
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 1
      template:
        spec:
          {{- with .Values.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          automountServiceAccountToken: false
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          restartPolicy: Never
          containers:
            - name: review-worker
              image: {{ include "open-triage.image" .Values.api.image | quote }}
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              securityContext: {{- toYaml .Values.api.securityContext | nindent 16 }}
              command: ["node", "apps/api/dist/review/review-worker.entry.js"]
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: {{ include "open-triage.workloadSecretName" (dict "root" . "workload" "api" "config" .Values.secrets.api) }}, key: DATABASE_URL } }
                - name: REVIEW_BATCH_SIZE
                  value: {{ .Values.reviewWorker.batchSize | quote }}
              resources: {{- toYaml .Values.reviewWorker.resources | nindent 16 }}
{{- end }}
