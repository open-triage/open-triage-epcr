{{- if not .Values.secrets.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-triage.fullname" . }}-api-database
  labels:
    {{- include "open-triage.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.api.databaseUrl is required" .Values.secrets.api.databaseUrl | quote }}
  SUPABASE_URL: {{ .Values.secrets.api.supabaseUrl | quote }}
  SUPABASE_SECRET_KEY: {{ .Values.secrets.api.supabaseSecretKey | quote }}
  PATIENT_KEY_INSTALLATION_ID: {{ required "secrets.api.patientKeyInstallationId is required" .Values.secrets.api.patientKeyInstallationId | quote }}
  PATIENT_KEY_VERSION: {{ .Values.secrets.api.patientKeyVersion | quote }}
  PATIENT_KEY_SECRET_BASE64: {{ required "secrets.api.patientKeySecretBase64 is required" .Values.secrets.api.patientKeySecretBase64 | quote }}
  AUTH_RATE_LIMIT_SECRET_BASE64: {{ required "secrets.api.authRateLimitSecretBase64 is required" .Values.secrets.api.authRateLimitSecretBase64 | quote }}
---
{{- end }}
{{- $root := . }}
{{- range $entry := list
  (dict "workload" "migration" "config" .Values.secrets.migration)
  (dict "workload" "analytics-projector" "config" .Values.secrets.analyticsProjector)
  (dict "workload" "analytics-health" "config" .Values.secrets.analyticsHealth)
  (dict "workload" "retention" "config" .Values.secrets.retention)
  (dict "workload" "operational-audit" "config" .Values.secrets.operationalAudit) }}
{{- if not $entry.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-triage.fullname" $root }}-{{ $entry.workload }}-database
  labels:
    {{- include "open-triage.labels" $root | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required (printf "secrets.%s.databaseUrl is required" $entry.workload) $entry.config.databaseUrl | quote }}
---
{{- end }}
{{- end }}
