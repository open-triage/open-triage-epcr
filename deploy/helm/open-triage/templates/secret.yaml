apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-triage.fullname" . }}-database
  labels:
    {{- include "open-triage.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  SUPABASE_URL: {{ .Values.secrets.supabaseUrl | quote }}
  SUPABASE_SECRET_KEY: {{ .Values.secrets.supabaseSecretKey | quote }}
  PATIENT_KEY_INSTALLATION_ID: {{ required "secrets.patientKeyInstallationId is required" .Values.secrets.patientKeyInstallationId | quote }}
  PATIENT_KEY_VERSION: {{ .Values.secrets.patientKeyVersion | quote }}
  PATIENT_KEY_SECRET_BASE64: {{ required "secrets.patientKeySecretBase64 is required" .Values.secrets.patientKeySecretBase64 | quote }}
