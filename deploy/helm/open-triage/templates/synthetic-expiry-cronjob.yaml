{{- if .Values.syntheticExpiry.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "open-triage.fullname" . }}-synthetic-expiry
  labels: {{- include "open-triage.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.syntheticExpiry.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 12
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      backoffLimit: 1
      template:
        spec:
          imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          restartPolicy: Never
          containers:
            - name: synthetic-expiry
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              command: ["npm", "run", "purge:synthetic", "-w", "@open-triage/database"]
              envFrom: [{ secretRef: { name: {{ include "open-triage.databaseSecretName" . }} } }]
              resources: {{- toYaml .Values.syntheticExpiry.resources | nindent 16 }}
{{- end }}
