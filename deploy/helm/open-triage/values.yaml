web:
  strategy: Recreate
  image:
    repository: ghcr.io/open-triage/open-triage-web
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  securityContext:
    runAsUser: 101
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }
  host: demo.opentriage.org
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

api:
  strategy: Recreate
  image:
    repository: ghcr.io/open-triage/open-triage-api
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  securityContext:
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }
  host: api.demo.opentriage.org
  trustProxyHops: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

migration:
  enabled: true
  bootstrapSynthetic: false
  activeDeadlineSeconds: 600
  pgOptions: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

analytics:
  enabled: true
  schedule: "*/2 * * * *"
  healthSchedule: "* * * * *"
  batchSize: 500
  maxAttempts: 12
  freshnessTargetSeconds: 300
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  healthResources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

reviewWorker:
  enabled: true
  schedule: "* * * * *"
  batchSize: 25
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

syntheticExpiry:
  enabled: true
  schedule: "* * * * *"
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

imagePullSecrets: []
# Optional placement shared by the web, API, migration, and scheduled jobs.
nodeSelector: {}
# The web image also serves the fixed opentriage.org public one-pager.
# Enable only where DNS and an ingress.tls certificate cover that domain.
publicSite:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
ingress:
  # Annotation behavior is separate from the cluster's IngressClass name.
  controller: nginx
  className: nginx
  annotations: {}
  tls: []
  authenticationRateLimit:
    enabled: true
    requestsPerSecond: 10
    burstMultiplier: 3

secrets:
  # Production Secrets are cluster-owned and contain one workload credential.
  # Empty existingSecret values opt into Helm-managed Secrets for non-hook
  # workloads; the migration hook always requires a pre-existing Secret.
  api:
    existingSecret: open-triage-api-database
    databaseUrl: ""
    supabaseUrl: ""
    supabaseSecretKey: ""
    patientKeyInstallationId: ""
    patientKeyVersion: "1"
    patientKeySecretBase64: ""
    authRateLimitSecretBase64: ""
    offlineRecoveryKeyVersion: "1"
    offlineRecoverySecretBase64: ""
  migration:
    existingSecret: open-triage-migration-database
    databaseUrl: ""
  analyticsProjector:
    existingSecret: open-triage-analytics-projector-database
    databaseUrl: ""
  analyticsHealth:
    existingSecret: open-triage-analytics-health-database
    databaseUrl: ""
  retention:
    existingSecret: open-triage-retention-database
    databaseUrl: ""
  operationalAudit:
    existingSecret: open-triage-operational-audit-database
    databaseUrl: ""
