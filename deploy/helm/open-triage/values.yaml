web:
  strategy: Recreate
  image:
    repository: ghcr.io/open-triage/open-triage-web
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  host: demo.opentriage.org
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

api:
  installationSettingsBaseline: synthetic-demo
  strategy: Recreate
  image:
    repository: ghcr.io/open-triage/open-triage-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  host: api.demo.opentriage.org
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

migration:
  enabled: true
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

analytics:
  enabled: true
  schedule: "*/2 * * * *"
  healthSchedule: "* * * * *"

imagePullSecrets: []
ingress:
  className: nginx
  tls: []

secrets:
  # The demo Secret is cluster-owned. When this is set, the chart only
  # references it and ignores the managed Secret values below.
  existingSecret: open-triage-database
  databaseUrl: ""
  supabaseUrl: ""
  supabaseSecretKey: ""
  patientKeyInstallationId: ""
  patientKeyVersion: "1"
  patientKeySecretBase64: ""
